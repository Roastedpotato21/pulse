<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse Studio</title>
    <!-- CSS will be injected by the extension or referenced via Uri -->
    <link rel="stylesheet" href="${styleUri}">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar for History -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h3>History</h3>
            </div>
            <ul id="history-list" class="history-list">
                <!-- History items injected here -->
            </ul>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-area">
            <!-- Header with Agent Status -->
            <header class="chat-header">
                <div class="agent-status">
                    <span id="status-indicator" class="status-indicator idle"></span>
                    <span id="status-text" class="status-text">Pulse is Idle</span>
                </div>
            </header>

            <!-- Messages Container -->
            <div id="messages" class="messages-container" aria-live="polite">
                <div class="message pulse-message intro-message">
                    <div class="message-content">Hello! I am Pulse. How can I help you today?</div>
                </div>
            </div>

            <!-- Task Progress Panel -->
            <div id="task-panel" class="task-panel hidden">
                <div class="task-header">
                    <span class="task-title">Current Task</span>
                    <span id="task-progress-text" class="task-progress-text">0%</span>
                </div>
                <div class="progress-bar-container">
                    <div id="task-progress-bar" class="progress-bar"></div>
                </div>
                <div id="task-details" class="task-details"></div>
            </div>

            <!-- Input Area -->
            <form id="chat-form" class="input-area">
                <div class="input-wrapper">
                    <textarea id="prompt" class="prompt-input" aria-label="Prompt Pulse" rows="1" placeholder="Ask Pulse about this workspace..."></textarea>
                    <button type="submit" class="send-button" id="send-button" aria-label="Send">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
            </form>
        </main>
    </div>
    
    <!-- Script will be injected by the extension -->
    <script src="${scriptUri}"></script>
</body>
</html>
