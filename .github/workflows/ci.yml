name: CI

on:
  pull_request:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:
    inputs:
      docker_security_tests:
        description: "Run optional live Docker sandbox security tests"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run ruff check src tests
      - name: Run unit and cross-platform tests
        run: uv run pytest --ignore-glob="tests/test_sandbox*.py"

  docker-security:
    if: github.event_name != 'workflow_dispatch' || inputs.docker_security_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Inspect Docker health
        run: docker info
      - name: Run live Docker sandbox security tests
        run: uv run pytest tests/ -k sandbox
