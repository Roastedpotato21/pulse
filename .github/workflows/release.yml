name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6.7.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: uv sync --locked
      - run: uv run ruff check src tests scripts
      - run: uv run mypy
      - run: >-
          uv run pytest tests/ -k "not sandbox"
          --cov=pulse --cov-report=term-missing --cov-fail-under=54
      - run: uv run python scripts/run_release_evals.py evals/release-v1.json release-metadata/eval-report.json
      - run: uv run pip-audit --progress-spinner off
      - run: npm ci
        working-directory: vscode-extension
      - run: npm run compile
        working-directory: vscode-extension
      - run: uv build
      - run: >-
          uv run python scripts/verify_release_artifacts.py dist
          --expected-version "${{ github.ref_name }}"
      - run: >-
          uv run python scripts/generate_release_metadata.py
          dist release-metadata --source-commit "${{ github.sha }}"
      - run: >-
          uv export --locked --no-dev --no-emit-project --no-hashes
          --output-file release-metadata/runtime-requirements.txt
      - run: >-
          uv run pip-audit --progress-spinner off
          --requirement release-metadata/runtime-requirements.txt --format cyclonedx-json
          --output release-metadata/sbom.cdx.json
      - run: >-
          uv run python scripts/finalize_sbom.py release-metadata/sbom.cdx.json
          release-metadata/release-manifest.json
      - name: Sign build provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-checksums: release-metadata/SHA256SUMS
      - name: Sign SBOM attestation
        uses: actions/attest-sbom@51e74621a501c89df81fc1391c5a8f4cfc9fab2f # v3
        with:
          subject-checksums: release-metadata/SHA256SUMS
          sbom-path: release-metadata/sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-metadata
          path: release-metadata/
          if-no-files-found: error

  provider-e2e:
    needs: build-and-verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: public-beta
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6.7.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Run live provider evaluation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PULSE_E2E_PROVIDER: openai
          PULSE_E2E_MODEL: ${{ vars.PULSE_E2E_MODEL }}
        run: >-
          uv run python scripts/run_provider_e2e.py
          evals/provider-live-v1.json release-metadata/provider-eval-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: provider-evaluation
          path: release-metadata/provider-eval-report.json
          if-no-files-found: error

  docker-security:
    needs: build-and-verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6.7.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: docker info
      - run: docker pull python:3.11-slim
      - run: docker pull alpine:3.22
      - run: >-
          uv run pytest tests/ -k sandbox
          --junitxml=release-metadata/docker-full.xml
      - run: uv run python scripts/run_docker_release_tests.py release-metadata/docker-release.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: docker-security-report
          path: release-metadata/*.xml
          if-no-files-found: warn

  publish-pypi:
    needs: [build-and-verify, provider-e2e, docker-security]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pulse-coding-agent
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  publish-github-assets:
    needs: [build-and-verify, provider-e2e, docker-security, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-distributions
          path: dist/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-metadata
          path: release-metadata/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: provider-evaluation
          path: release-metadata/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: docker-security-report
          path: release-metadata/
      - name: Create verified GitHub Release with evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" dist/* release-metadata/*
          --verify-tag --generate-notes --title "Pulse $RELEASE_TAG"
