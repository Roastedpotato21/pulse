[extend]
useDefault = true

# Gitleaks 8.24.x (used by the pinned action) expects the singular global
# table. The plural form was introduced in 8.25.0.
[allowlist]
description = "Documented synthetic credentials used by secret-redaction tests"
regexTarget = "secret"
regexes = [
  '''sk-proj-1234567890abcdef1234567890abcdef''',
  '''eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiI5ODciLCJlbWFpbCI6ImFsaWNlQGV4YW1wbGUuY29tIiwibmFtZSI6IkFsaWNlIn0\.sig''',
  '''A7mQ2xL9vR4pN8cK6sJ3wH5yB1dF0gZ9uT''',
  # Shared fake Google Desktop credential used to validate packaging and
  # redaction behavior. This exact value is not accepted by Google.
  '''GOCSPX-abcdefghijklmnopqrstuvwxyz123456''',
]
