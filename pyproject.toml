[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pulse-coding-agent"
version = "0.1.0"
description = "Permissioned single-model project agent CLI."
readme = "README.md"
requires-python = ">=3.11"
keywords = ["ai", "coding-agent", "developer-tools", "sandbox"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "httpx==0.28.1",
    "keyring==25.7.0",
    "openai==2.44.0",
    "python-dotenv==1.2.2",
    "rich==15.0.0",
    "typer==0.26.8",
    "websockets==16.1",
]

[project.urls]
Homepage = "https://github.com/Roastedpotato21/pulse"
Repository = "https://github.com/Roastedpotato21/pulse"
Issues = "https://github.com/Roastedpotato21/pulse/issues"

[project.scripts]
pulse = "pulse.cli:main"
pulse-rpc = "pulse.rpc:main"
pulse-remote = "pulse.sandbox.remote.server:main"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/pulse"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/scripts",
    "/tests",
    "/evals",
    "/README.md",
    "/ARCHITECTURE.md",
    "/ROADMAP.md",
    "/PRODUCTION_CHECKPOINTS.md",
    "/OPERATIONS.md",
    "/SECURITY.md",
    "/CHANGELOG.md",
    "/agent.config.json",
    "/.env.example",
    "/pyproject.toml",
    "/uv.lock",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::pulse.sandbox.api._SecurityWarning",
    "ignore::pulse.sandbox.backend.host._SecurityWarning",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = [
    "src/pulse/tool_policy.py",
    "src/pulse/production.py",
    "src/pulse/eval",
]

[dependency-groups]
dev = [
    "mypy>=1.18,<2",
    "pip-audit>=2.9.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.16.3",
]
