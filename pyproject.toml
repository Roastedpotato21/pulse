[project]
name = "pulse"
version = "0.1.0"
description = "Permissioned single-model project agent CLI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.0",
    "keyring>=24.0.0",
    "openai>=2.44.0",
    "python-dotenv>=1.2.2",
    "rich>=13.9.0",
    "ruff>=0.16.1",
    "typer>=0.26.8",
    "websockets>=15.0",
]

[project.scripts]
pulse = "pulse.cli:main"
pulse-rpc = "pulse.rpc:main"

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
